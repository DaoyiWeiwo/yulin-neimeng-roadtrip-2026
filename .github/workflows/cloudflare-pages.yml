name: Publish to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets

          cp '2026榆林内蒙古往返六日自驾攻略.html' _site/index.html
          cp '2026榆林内蒙古往返六日自驾攻略.html' '_site/2026榆林内蒙古往返六日自驾攻略.html'
          cp '2026榆林内蒙古往返六日自驾攻略.html' '_site/2026榆林往返六日自驾攻略.html'
          cp '内蒙古文旅一卡通权益.html' styles.css tokens.css transcripts.js app.js _site/
          cp -R assets/benefits-20260914 assets/benefits-20260916 _site/assets/
          touch _site/.nojekyll

          cat > _site/_headers <<'EOF'
          /index.html
            Cache-Control: no-cache, no-store, must-revalidate
          /*.html
            Cache-Control: no-cache, no-store, must-revalidate
          /version.json
            Cache-Control: no-cache, no-store, must-revalidate
          EOF
          printf '{"revision":"%s","updatedAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.140.0'
          command: pages deploy _site --project-name yulin-neimeng-roadtrip-2026 --branch main --commit-hash ${{ github.sha }} --commit-message "${{ github.event.head_commit.message }}"
